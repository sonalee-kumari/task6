<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Login</title>
  <link rel="stylesheet" href="style.css">

 
</head>
<body>

  <div class="container">
    <div class="left">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR31OeaseOSaiS7uSfKwAVPuWGJ-p0c_EkcjQ&s" alt="laundary image">
    </div>

    <div class="right">
      <h2>Login</h2>

      <label>Email</label>
      <input type="email" placeholder="Email">

      <label>Password</label>
      <input type="password" placeholder="Password">

      <div class="forgot">
        <a href="#">Forgot Password?</a>
      </div>

      <button>Login</button>

      <div class="register">
        Not a member?
        <a href="#">Register Now</a>
      </div>
    </div>

  </div>

</body>
</html>
